name: streamlit-flowise-chat
services:
  chat:
    build: .
    ports:
      - "127.0.0.1:8501:8501"
    env_file:
      - .env
    environment:
      DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
      DEEPEVAL_DISABLE_DOTENV: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    volumes:
      - chat_history:/app/data
volumes:
  chat_history:
